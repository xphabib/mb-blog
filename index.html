<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Blog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f2;
        --panel: #ffffff;
        --text: #202124;
        --muted: #62645f;
        --line: #deded6;
        --accent: #0f6b57;
        --accent-strong: #09483b;
        --code: #f0f2ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      a {
        color: var(--accent);
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .header-inner {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .search {
        width: min(320px, 42vw);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        background: var(--panel);
        color: var(--text);
      }

      .layout {
        width: min(1120px, calc(100% - 32px));
        margin: 32px auto;
        display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }

      .post-list {
        display: grid;
        gap: 10px;
      }

      .post-button {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 14px;
        cursor: pointer;
        font: inherit;
      }

      .post-button:hover,
      .post-button[aria-current="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 107, 87, 0.1);
      }

      .post-button strong {
        display: block;
        line-height: 1.3;
      }

      .post-button span {
        display: block;
        color: var(--muted);
        font-size: 0.88rem;
        margin-top: 4px;
      }

      .article {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: clamp(20px, 4vw, 44px);
        min-height: 420px;
      }

      .article h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .meta {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .content h2,
      .content h3 {
        line-height: 1.2;
        margin-top: 1.8em;
      }

      .content img {
        max-width: 100%;
        border-radius: 8px;
      }

      .content pre {
        overflow-x: auto;
        background: var(--code);
        border-radius: 8px;
        padding: 16px;
      }

      .content code {
        background: var(--code);
        border-radius: 4px;
        padding: 2px 5px;
      }

      .content pre code {
        padding: 0;
      }

      .empty,
      .error {
        color: var(--muted);
      }

      .error {
        border: 1px solid #d9a441;
        background: #fff8e5;
        color: #65420b;
        padding: 14px;
        border-radius: 8px;
      }

      @media (max-width: 760px) {
        .header-inner {
          min-height: 92px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
        }

        .search {
          width: 100%;
        }

        .layout {
          grid-template-columns: 1fr;
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1 class="brand">Markdown Blog</h1>
          <p class="subtitle">Posts are loaded directly from Markdown files.</p>
        </div>
        <input class="search" id="search" type="search" placeholder="Search posts" autocomplete="off">
      </div>
    </header>

    <main class="layout">
      <aside>
        <div class="post-list" id="postList" aria-label="Posts"></div>
      </aside>

      <article class="article" id="article">
        <p class="empty">Loading posts...</p>
      </article>
    </main>

    <script>
      const postList = document.querySelector("#postList");
      const article = document.querySelector("#article");
      const search = document.querySelector("#search");
      let posts = [];
      let activeSlug = "";

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function inlineMarkdown(value) {
        return escapeHtml(value)
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function markdownToHtml(markdown) {
        const lines = markdown.trim().split(/\r?\n/);
        const html = [];
        let listOpen = false;
        let codeOpen = false;
        let paragraph = [];

        function closeParagraph() {
          if (!paragraph.length) return;
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }

        function closeList() {
          if (!listOpen) return;
          html.push("</ul>");
          listOpen = false;
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            closeParagraph();
            closeList();
            if (codeOpen) {
              html.push("</code></pre>");
            } else {
              html.push("<pre><code>");
            }
            codeOpen = !codeOpen;
            continue;
          }

          if (codeOpen) {
            html.push(escapeHtml(line) + "\n");
            continue;
          }

          if (!line.trim()) {
            closeParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          const item = line.match(/^-\s+(.+)$/);
          if (item) {
            closeParagraph();
            if (!listOpen) {
              html.push("<ul>");
              listOpen = true;
            }
            html.push(`<li>${inlineMarkdown(item[1])}</li>`);
            continue;
          }

          paragraph.push(line.trim());
        }

        closeParagraph();
        closeList();
        if (codeOpen) html.push("</code></pre>");
        return html.join("\n");
      }

      function parseFrontMatter(markdown, slug) {
        const match = markdown.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
        const meta = {};
        let body = markdown;

        if (match) {
          body = match[2];
          for (const line of match[1].split(/\r?\n/)) {
            const separator = line.indexOf(":");
            if (separator === -1) continue;
            const key = line.slice(0, separator).trim();
            const value = line.slice(separator + 1).trim();
            meta[key] = value;
          }
        }

        return {
          slug,
          title: meta.title || slug.replace(/-/g, " ").replace(/\.md$/, ""),
          date: meta.date || "",
          excerpt: meta.excerpt || "",
          body,
        };
      }

      function parseIndex(indexMarkdown) {
        return indexMarkdown
          .split(/\r?\n/)
          .map((line) => line.match(/^-\s+(.+?\.md)\s*$/))
          .filter(Boolean)
          .map((match) => match[1]);
      }

      function renderList() {
        const query = search.value.trim().toLowerCase();
        const visiblePosts = posts.filter((post) => {
          const text = `${post.title} ${post.excerpt} ${post.body}`.toLowerCase();
          return text.includes(query);
        });

        postList.innerHTML = visiblePosts.map((post) => `
          <button class="post-button" type="button" data-slug="${post.slug}" aria-current="${post.slug === activeSlug}">
            <strong>${escapeHtml(post.title)}</strong>
            <span>${escapeHtml(post.date || post.excerpt)}</span>
          </button>
        `).join("") || '<p class="empty">No posts found.</p>';
      }

      function renderPost(slug) {
        const post = posts.find((item) => item.slug === slug) || posts[0];
        if (!post) {
          article.innerHTML = '<p class="empty">No posts yet.</p>';
          return;
        }

        activeSlug = post.slug;
        location.hash = post.slug.replace(/\.md$/, "");
        article.innerHTML = `
          <h1>${escapeHtml(post.title)}</h1>
          <p class="meta">${escapeHtml([post.date, post.excerpt].filter(Boolean).join(" · "))}</p>
          <div class="content">${markdownToHtml(post.body)}</div>
        `;
        renderList();
      }

      async function loadPosts() {
        try {
          const indexResponse = await fetch("posts/index.md", { cache: "no-store" });
          if (!indexResponse.ok) throw new Error("Could not load posts/index.md");
          const filenames = parseIndex(await indexResponse.text());

          posts = await Promise.all(filenames.map(async (filename) => {
            const response = await fetch(`posts/${filename}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`Could not load posts/${filename}`);
            return parseFrontMatter(await response.text(), filename);
          }));

          posts.sort((a, b) => b.date.localeCompare(a.date));
          const hashSlug = location.hash.replace(/^#/, "");
          const initialPost = posts.find((post) => post.slug.replace(/\.md$/, "") === hashSlug);
          renderPost(initialPost ? initialPost.slug : posts[0]?.slug);
        } catch (error) {
          article.innerHTML = `
            <div class="error">
              <strong>Posts could not be loaded.</strong>
              <p>Open this with a local server, for example: <code>python3 -m http.server 8000</code></p>
              <p>${escapeHtml(error.message)}</p>
            </div>
          `;
        }
      }

      postList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-slug]");
        if (button) renderPost(button.dataset.slug);
      });

      search.addEventListener("input", renderList);
      window.addEventListener("hashchange", () => {
        const hashSlug = location.hash.replace(/^#/, "");
        const post = posts.find((item) => item.slug.replace(/\.md$/, "") === hashSlug);
        if (post) renderPost(post.slug);
      });

      loadPosts();
    </script>
  </body>
</html>
